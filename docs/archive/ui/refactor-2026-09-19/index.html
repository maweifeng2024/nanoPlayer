<style>*{box-sizing:border-box}body{margin:0;background:#121316;color:#eeeeef;font:15px/1.6 system-ui,sans-serif}header,main{max-width:1500px;margin:auto;padding:28px}header{border-bottom:1px solid #303138}h1{font-size:26px;margin:0 0 8px}p{color:#b4b5bf;margin:0}b{color:#e65353}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}button{font:inherit;padding:8px 16px;background:#25262c;border:1px solid #393a42;color:inherit;border-radius:8px;cursor:pointer}button[aria-pressed=true]{border-color:#e65353;color:#ff8888;background:#3c2528}button:focus-visible{outline:2px solid #e65353;outline-offset:3px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;min-width:0}figcaption{margin-bottom:12px;color:#b4b5bf}img{display:block;max-width:100%;height:auto;max-height:900px;border:1px solid #34353c;border-radius:12px;margin:auto}.note{margin:24px 0;font-size:13px}a{color:#ffa3a3}@media(max-width:760px){.comparison{grid-template-columns:1fr}header,main{padding:20px}}</style>
<header><h1><b>nano</b>Player · UI 重构对照</h1><p>保留导航结构，统一视觉刻度，改善桌面、手机与 Pad 的布局和操作。</p><nav aria-label="选择屏幕尺寸"></nav></header>
<main><div class="comparison"><figure><figcaption>修改前 · 2026-09-19 保存的工作区界面</figcaption><img id="before" alt="修改前界面"></figure><figure><figcaption>修改后 · 已加载封面的浏览器视觉基线</figcaption><img id="after" alt="修改后界面"></figure></div><p class="note">手机与 Pad 为浏览器尺寸模拟，不代表真机验收。<a href="../UI_REFACTOR_2026-09-19.md">查看实现与验证记录</a></p></main>
<script>const screens=[['desktop-dark','桌面 · 深色'],['desktop-light','桌面 · 浅色'],['desktop-720','桌面 · 720px'],['phone-360','手机 · 360px'],['pad-600','Pad · 600px'],['pad-1024','Pad · 1024px']];const nav=document.querySelector('nav');function show(key){document.querySelector('#before').src=`../../../design/baseline/${key}.png`;document.querySelector('#after').src=`../../../../tests/e2e/ui-visual.spec.ts-snapshots/${key}-darwin.png`;for(const button of nav.children)button.setAttribute('aria-pressed',String(button.dataset.key===key));}for(const[key,label]of screens){const b=document.createElement('button');b.textContent=label;b.dataset.key=key;b.onclick=()=>show(key);nav.append(b);}show(screens[0][0]);</script></html>
