[package]
name = "nanoplayer"
version = "0.1.7"
description = "A local-first desktop music library"
authors = ["nanoPlayer contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nanoplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
lofty = "0.25.1"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all", "experimental"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"

tauri-plugin-updater = "2"
tauri-plugin-process = "2"
