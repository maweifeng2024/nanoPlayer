name: Publish release artifacts and website
run-name: Publish ${{ inputs.tag }} from run ${{ inputs.source_run_id }}

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
      published_run_id:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v0.1.6)
        required: true
        type: string
      source_run_id:
        description: Original successful three-platform build run ID
        required: true
        type: string
      published_run_id:
        description: Optional prior publish run with verified published-release artifact; skip uploading again
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-nanoplayer-production
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  publish:
    if: ${{ !inputs.published_run_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate artifact provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: node scripts/release/validate-release-source.mjs "$RELEASE_TAG" "$SOURCE_RUN_ID"
      - uses: actions/download-artifact@v5
        with:
          pattern: '{macos,windows,linux}'
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-artifacts
          merge-multiple: true
      - run: node scripts/release/create-updater-manifest.mjs "${RELEASE_TAG#v}" "$GITHUB_REPOSITORY" release-artifacts
      - run: node scripts/release/create-checksums.mjs release-artifacts
      - run: node scripts/release/update-website-release.mjs "${RELEASE_TAG#v}" "${GITHUB_REPOSITORY}" release-artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: published-release
          path: release-artifacts/*.*

  website:
    if: ${{ always() && !cancelled() && (needs.publish.result == 'success' || inputs.published_run_id != '') }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN repository secret'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID repository secret'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID repository secret'; exit 1; }
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Validate previously published artifacts
        if: ${{ inputs.published_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_RUN_ID: ${{ inputs.published_run_id }}
        run: node scripts/release/validate-published-source.mjs "$RELEASE_TAG" "$PUBLISHED_RUN_ID"
      - uses: actions/download-artifact@v5
        with:
          run-id: ${{ inputs.published_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: published-release
          path: release-artifacts
      - name: Update download manifest
        run: node scripts/release/update-website-release.mjs "${RELEASE_TAG#v}" "${GITHUB_REPOSITORY}" release-artifacts
      - run: npm ci --prefix website
      - run: npm run build --prefix website
      - name: Deploy website to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@59.10.0 pull --yes --environment=production --cwd website
          npx --yes vercel@59.10.0 build --prod --cwd website
          DEPLOYMENT_URL="$(npx --yes vercel@59.10.0 deploy --prebuilt --prod --yes --cwd website)"
          echo "url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"
      - name: Verify live pages and release metadata
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node scripts/release/verify-website.mjs "$DEPLOYMENT_URL" "${RELEASE_TAG#v}"
          node scripts/release/verify-website.mjs "https://nanoplayer-wei-feng.vercel.app" "${RELEASE_TAG#v}"
      - name: Persist verified download metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/persist-website-manifest.mjs
