name: Publish release artifacts and website
run-name: Publish ${{ inputs.tag }} from run ${{ inputs.source_run_id }}

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
      published_run_id:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v0.1.6)
        required: true
        type: string
      source_run_id:
        description: Original successful three-platform build run ID
        required: true
        type: string
      published_run_id:
        description: Optional prior publish run with verified published-release artifact; skip uploading again
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-nanoplayer-production
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  publish:
    if: ${{ !inputs.published_run_id }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate artifact provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: node scripts/release/validate-release-source.mjs "$RELEASE_TAG" "$SOURCE_RUN_ID"
      - uses: actions/download-artifact@v6
        with:
          pattern: '{macos,windows,linux}'
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-artifacts
          merge-multiple: true
      - run: node scripts/release/create-updater-manifest.mjs "${RELEASE_TAG#v}" "$GITHUB_REPOSITORY" release-artifacts
      - run: node scripts/release/create-checksums.mjs release-artifacts
      - run: node scripts/release/update-website-release.mjs "${RELEASE_TAG#v}" "${GITHUB_REPOSITORY}" release-artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish-assets.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: published-release
          path: release-artifacts/*.*

  website:
    if: ${{ always() && !cancelled() && (needs.publish.result == 'success' || inputs.published_run_id != '') }}
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Validate previously published artifacts
        if: ${{ inputs.published_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_RUN_ID: ${{ inputs.published_run_id }}
        run: node scripts/release/validate-published-source.mjs "$RELEASE_TAG" "$PUBLISHED_RUN_ID"
      - uses: actions/download-artifact@v6
        with:
          run-id: ${{ inputs.published_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: published-release
          path: release-artifacts
      - name: Update download manifest
        run: node scripts/release/update-website-release.mjs "${RELEASE_TAG#v}" "${GITHUB_REPOSITORY}" release-artifacts
      - run: npm ci --prefix website
      - run: npm run build --prefix website
      - name: Deploy website to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm --prefix website run deploy
      - name: Verify live pages and release metadata
        run: node scripts/release/verify-website.mjs "https://nanoplayer.nanodo.cc" "${RELEASE_TAG#v}"
      - name: Persist verified download metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/persist-website-manifest.mjs
