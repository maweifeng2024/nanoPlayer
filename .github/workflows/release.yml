name: Release bundles and website

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml database::tests::search_benchmark_10000_tracks -- --ignored --exact
      - run: npm ci --prefix website
      - run: npm run build --prefix website

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS universal
            os: macos-15
            args: --target universal-apple-darwin
            artifact: macos
            paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          - platform: Windows x64
            os: windows-latest
            args: ''
            artifact: windows
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: Linux x64
            os: ubuntu-22.04
            args: ''
            artifact: linux
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release/check-version.mjs
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: node scripts/release/tauri-build.mjs
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: '*'
          path: release-artifacts
          merge-multiple: true
      - run: node scripts/release/create-checksums.mjs release-artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/* --verify-tag --generate-notes --title "nanoPlayer ${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: published-release
          path: release-artifacts

  website:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/download-artifact@v5
        with:
          name: published-release
          path: release-artifacts
      - name: Update download manifest
        run: node scripts/release/update-website-release.mjs "${GITHUB_REF_NAME#v}" "${GITHUB_REPOSITORY}" release-artifacts
      - run: npm ci --prefix website
      - run: npm run build --prefix website
      - name: Commit website release metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add website/public/downloads/latest.json
          git commit -m "chore(website): publish ${GITHUB_REF_NAME} downloads"
          git push origin main
      - name: Deploy website to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@59.10.0 pull --yes --environment=production --cwd website
          npx vercel@59.10.0 build --prod --cwd website
          DEPLOYMENT_URL="$(npx vercel@59.10.0 deploy --prebuilt --prod --cwd website)"
          echo "url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"
      - name: Verify live release metadata
        run: |
          curl --fail --location --retry 5 --retry-delay 5 "${{ steps.deploy.outputs.url }}/downloads/latest.json" --output live-latest.json
          node -e "const fs=require('fs');const live=JSON.parse(fs.readFileSync('live-latest.json'));if(live.version!==process.env.GITHUB_REF_NAME.slice(1))throw new Error('Live website version mismatch: '+live.version)"
