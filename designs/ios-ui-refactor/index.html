<aside class="review"><div class="wordmark"><em>nano</em>Player <small>iOS / 设计评审 01</small></div><h1>让音乐成为主角。</h1><p>沿用石墨与珊瑚红，将导航、浏览与播放分成清晰的三层。</p><label>预览尺寸<select id="size"><option value="phone">iPhone · 390</option><option value="small">小屏 · 360</option><option value="pad">iPad · 840</option><option value="wide">横屏 · 1024</option></select></label><label>外观<select id="theme"><option>深色</option><option>浅色</option><option>系统</option></select></label><label>染色方案<select id="tint"><option value="soft">柔和取色 · 推荐</option><option value="quiet">克制单色</option><option value="none">纯石墨</option></select></label><div class="notes"><strong>本轮评审重点</strong><p>01 固定上方染色，切歌不随机漂移。</p><p>02 推荐列表取消外框。</p><p>03 最近添加封面 ≤ 推荐封面 ⅔。</p><p>04 底部菜单可滚动，最末一行也能完整操作。</p></div><p class="fine">演示曲目与插画；不连接真实音乐库，不播放音频。先评审，再开发。</p></aside>
