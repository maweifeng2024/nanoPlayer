<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>nanoPlayer · 界面一致性评审</title><link rel="stylesheet" href="review.css"></head>
<body>
<header class="review-header"><div><b>nanoPlayer</b><span>界面一致性 / 评审稿 01</span></div><a href="REVIEW.md" target="_blank">设计说明 ↗</a></header>
<section class="review-tools" aria-label="评审控制"><div class="control-group"><label for="device">设备</label><select id="device"><option value="desktop">桌面 · 1200</option><option value="narrow">桌面 · 720</option><option value="phone">手机 · 390</option><option value="small">手机 · 360</option><option value="pad600">Pad · 600</option><option value="pad">Pad · 840</option><option value="wide">Pad · 1024</option></select></div><div class="control-group"><label for="view">场景</label><select id="view"><option>首页</option><option>歌曲</option><option>本地资料库</option><option>设置</option><option>正在播放</option><option>按钮与排版</option></select></div><div class="control-group"><label for="theme">主题</label><select id="theme"><option>深色</option><option>浅色</option><option>系统</option></select></div><button id="reference" aria-pressed="false">查看现有快照</button><button id="zoom" aria-pressed="true">适应窗口</button><span class="review-hint">仅设计演示 · 等待评审</span></section>
<div class="stage"><div id="frame" class="frame" data-device="desktop" data-theme="dark"><aside id="sidebar"></aside><div class="main"><header class="topbar"><button class="icon narrow-menu" data-action="navigation" aria-label="导航"></button><button class="icon history" data-action="back" aria-label="返回"></button><label class="search"><span id="search-icon"></span><input id="search" placeholder="搜索歌曲、艺术家、专辑" aria-label="搜索音乐"><kbd>⌘ K</kbd></label><button class="icon" data-page="设置" id="settings" aria-label="设置"></button></header><main id="content" tabindex="-1"></main></div><footer id="player"></footer><nav id="phone-nav" aria-label="手机导航"></nav><aside id="drawer" hidden></aside><div id="menu" role="menu" hidden></div><div id="toast" role="status"></div></div><figure id="reference-panel" hidden><img id="reference-image" alt="仓库中已有视觉快照，非本轮实时截图"><figcaption>仓库已有快照 · 历史参考，不代表当前程序的实时运行画面</figcaption></figure></div>
<footer class="review-footer"><p><b>本轮重点</b> 文字有层级，间距有节奏，操作有固定位置。</p><p>通过顶部场景切换检查按钮；点击歌曲更多、队列和设置查看交互状态。所有曲目与数量为演示数据。</p></footer>
<script src="icons.js"></script><script src="review.js"></script></body></html>
